name: "py-template"

services:
  db:
    image: postgres:17-alpine
    platform: linux/amd64
    ports:
      - '52432:5432'
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: python3 manage.py runserver 0.0.0.0:52000
    volumes:
      - ./app:/home/appuser/src
    ports:
      - "52000:52000"
    scale: 1
    env_file:
      - ./.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    restart: always
    depends_on:
      - db
      - redis
      - redpanda

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    # You might pin to a specific version instead of “latest”
    entrypoint: ["dragonfly", "--force_epoll"]
    ulimits:
      memlock: -1
    ports:
      - "52379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile-celery
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    ports:
      - "52555:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    env_file:
      - ./.env
    depends_on:
      - api
      - redis

  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile-test
    container_name: api-test-runner
    command: pytest
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_test
    restart: no
    depends_on:
      - db
      - redis

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster info --brokers=redpanda:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  email_worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      python3 manage.py consume_email_events
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      - redpanda

volumes:
  db-data:
  redis-data:
