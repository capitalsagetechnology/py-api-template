name: "biz-banking"

services:
  db:
    image: postgres:17-alpine
    platform: linux/amd64
    ports:
      - '60432:5432'
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: profmcdan/bizbanking-api
    command: python3 manage.py runserver 0.0.0.0:60000
    volumes:
      - ./app:/home/appuser/src
    expose:
      - "60000"
    scale: 1
    env_file:
      - ./.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    restart: always
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    ports:
      - "60001:60001"

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    # You might pin to a specific version instead of “latest”
    entrypoint: ["dragonfly", "--force_epoll"]
    ulimits:
      memlock: -1
    ports:
      - "41379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile-celery
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555
    ports:
      - "60555:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    env_file:
      - ./.env
    depends_on:
      - api
      - redis

  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile-test
    container_name: api-test-runner
    command: pytest
    volumes:
      - ./app:/app
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings_test
    restart: no
    depends_on:
      - db
      - redis

volumes:
  db-data:
  redis-data:
